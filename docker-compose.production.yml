services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DOC_QUERY_ENVIRONMENT: production
      DOC_QUERY_DATABASE_URL: ${DOC_QUERY_DATABASE_URL:?DOC_QUERY_DATABASE_URL is required}
      DOC_QUERY_REDIS_URL: ${DOC_QUERY_REDIS_URL:?DOC_QUERY_REDIS_URL is required}
      DOC_QUERY_STORAGE_ROOT: /app/uploads
      DOC_QUERY_CORS_ORIGINS: ${DOC_QUERY_CORS_ORIGINS:?DOC_QUERY_CORS_ORIGINS is required}
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=INFO --queues=documents
    environment:
      DOC_QUERY_ENVIRONMENT: production
      DOC_QUERY_DATABASE_URL: ${DOC_QUERY_DATABASE_URL:?DOC_QUERY_DATABASE_URL is required}
      DOC_QUERY_REDIS_URL: ${DOC_QUERY_REDIS_URL:?DOC_QUERY_REDIS_URL is required}
      DOC_QUERY_STORAGE_ROOT: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  uploads_data:
